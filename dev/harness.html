<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapdrill — render harness (dev only)</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <style>
      /* Harness chrome only — not shipped, so not in app.css. Dev tool:
         readability beats compactness, so scenes render large and
         full-width, stacked — not the narrow single-column phone-sized
         frame this used to be, which made label collisions in a dense
         scene impossible to judge by eye. */
      body {
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
      }
      .scene {
        margin-bottom: 48px;
      }
      .scene h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .scene-frame {
        /* South-india pack's viewBox is 800x815 (see pack.json) — matching
           that aspect ratio here means the map fills the frame edge to
           edge instead of letterboxing. Floors at 900px per the "at least
           900px wide" ask, caps at 1400px so it doesn't run edge-to-edge
           on an ultrawide monitor. */
        width: clamp(900px, 90vw, 1400px);
        aspect-ratio: 800 / 815;
      }
    </style>
  </head>
  <body>
    <p>Dev-only render harness — not part of the production build. See dev/harness.ts.</p>
    <div id="harness"></div>
    <script type="module" src="/dev/harness.ts"></script>
  </body>
</html>
